services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rag
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ==============================================================================
      # API KEYS & CONFIGURATION (Place your keys here or in a root .env file)
      # ==============================================================================
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - JINA_MODEL=${JINA_MODEL:-jina-embeddings-v3}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=pdf_documents
      - CHUNK_SIZE=600
      - CHUNK_OVERLAP=100
      - TOP_K=5
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_rag
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag_network

volumes:
  qdrant_storage:

networks:
  rag_network:
    driver: bridge
